name: Update FFXIV Item Data

on:
  schedule:
    # 每天凌晨 2:00 (UTC) 執行
    - cron: '0 2 * * *'
  workflow_dispatch:  # 允許手動觸發

permissions:
  contents: write  # 只需要寫入權限

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run data processor
      run: |
        python scripts/main.py
    
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 檢查是否有變更
        if git diff --quiet; then
          echo "✅ 沒有發現變更"
        else
          git add dist/ data/
          git commit -m "Update FFXIV item data $(date +'%Y-%m-%d %H:%M:%S')"
          git push
          echo "✅ 變更已提交並推送"
        fi
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ffxiv-data-$(date +'%Y%m%d')
        path: |
          dist/*.csv
          dist/*.json.gz
        retention-days: 30  # 保留 30 天

  # 可選：發送通知
  notify:
    needs: update-data
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Check status
      run: |
        if [ "${{ needs.update-data.result }}" == "success" ]; then
          echo "✅ 數據更新成功！"
          echo "📊 CSV 檔案已更新"
          echo "📦 JSON 壓縮檔已更新"
        else
          echo "❌ 數據更新失敗！"
          exit 1
        fi