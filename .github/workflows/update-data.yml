name: Update FFXIV Item Data

on:
  schedule:
    # 每天凌晨 2:00 (UTC) 執行
    - cron: '0 2 * * *'
  workflow_dispatch:  # 允許手動觸發

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run data processor
      run: |
        python scripts/main.py
    
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add dist/ data/
        git diff --staged --quiet || git commit -m "Update FFXIV item data $(date +'%Y-%m-%d')"
        git push
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ffxiv-data
        path: |
          dist/*.csv
          dist/*.json.gz
    
    - name: Setup Pages
      if: github.ref == 'refs/heads/main'
      uses: actions/configure-pages@v4
    
    - name: Upload to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'dist'
    
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      id: deployment
      uses: actions/deploy-pages@v4

  # 可選：發送通知
  notify:
    needs: update-data
    runs-on: ubuntu-latest
    if: always()  # 不論成功與否都發送通知
    
    steps:
    - name: Check status
      run: |
        if [ "${{ needs.update-data.result }}" == "success" ]; then
          echo "✅ Data update successful!"
        else
          echo "❌ Data update failed!"
          exit 1
        fi