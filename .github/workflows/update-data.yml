name: Update FFXIV Item Data

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run data processor
      id: processor
      run: |
        python scripts/main.py
        
        # 獲取當前的日期時間作為版本標籤
        echo "VERSION_TAG=$(date +'v%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
        echo "RELEASE_DATE=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

    # 🔑 加上條件判斷：只有 SHOULD_UPDATE 為 true 時才 commit
    - name: Commit and push changes
      if: steps.processor.outputs.SHOULD_UPDATE == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        git add -A
        
        if git diff --staged --quiet; then
          echo "✅ 沒有發現變更"
        else
          git commit -m "Update FFXIV item data - ${{ steps.processor.outputs.RELEASE_DATE }}"
          git push
          echo "✅ 變更已提交並推送"
        fi

    # 🔑 加上條件判斷：只有 SHOULD_UPDATE 為 true 時才發布 Release
    - name: Create Release
      if: steps.processor.outputs.SHOULD_UPDATE == 'true'
      uses: softprops/action-gh-release@v1
      with:
        name: "FFXIV Item Data ${{ steps.processor.outputs.RELEASE_DATE }}"
        tag_name: ${{ steps.processor.outputs.VERSION_TAG }}
        body: |
          **更新時間**: ${{ steps.processor.outputs.RELEASE_DATE }}
        files: |
          dist/ffxiv_items_all_languages.csv
          dist/ffxiv_items_all_languages.json.gz
          dist/version.txt
        draft: false
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 清理 Job 也順便加上判斷，只有有發布時才清理（可選）
  cleanup-releases:
    needs: update-data
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Cleanup old releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      with:
        keep_latest: 30
        delete_tags: true
        delete_tag_pattern: 'v*'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}